name: Premium server

on:
  workflow_dispatch:

env:
  PREMIUM_USERNAME: ServerPremium
  PREMIUM_PASS: ServerPre@123

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create user
        shell: cmd
        run: |
          net user "%PREMIUM_USERNAME%" "%PREMIUM_PASS%" /add
          net localgroup administrators "%PREMIUM_USERNAME%" /add
          net localgroup "Remote Desktop Users" "%PREMIUM_USERNAME%" /add

      - name: Pre-install Dev Tools & Environment
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\install.bat"

      - name: Cloudflare Tunnel
        shell: cmd
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: call "%GITHUB_WORKSPACE%\cloudflared.bat"

      - name: Show credentials
        shell: cmd
        run: |
          echo.
          echo ==========================================
          echo RDP Host : ${{ secrets.CF_HOSTNAME }}
          echo User     : %PREMIUM_USERNAME%
          echo Password : %PREMIUM_PASS%
          echo ==========================================
          echo.

      - name: Keep alive
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\sleep.bat"