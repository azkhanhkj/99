name: Premium server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Install Cloudflared
        run: choco install cloudflared -y

      - name: Install Cloudflared
        shell: powershell
        run: |
          choco install cloudflared -y

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Start-Service TermService
          Set-Service TermService -StartupType Automatic

      - name: Reset RDP sessions
        shell: powershell
        run: |
          query session
          $sessions = (query session | Select-String "Disc").ToString()
          foreach ($line in $sessions) {
            $id = ($line -split '\s+')[-1]
            if ($id -match '^\d+$') {
              logoff $id
            }
          }

      - name: Create user
        shell: powershell
        run: |
          $User = "ServerPremium"
          $Pass = "ServerPre@123"

          net user $User $Pass /add
          net localgroup administrators $User /add
          net localgroup "Remote Desktop Users" $User /add

      - name: Start Cloudflare Tunnel
        run: cloudflared service install ${{ secrets.CF_TOKEN }}

      - name: Show credentials
        shell: powershell
        run: |
          Write-Host "------------------------------------------"
          Write-Host "RDP Host: ${{ secrets.CF_HOSTNAME }}"
          Write-Host "User: ServerPremium"
          Write-Host "Pass: ServerPre@123"
          Write-Host "------------------------------------------"

      - name: Keep alive
        shell: powershell
        run: |
          $seconds = 21500
          for ($i = 0; $i -lt $seconds; $i += 10) {
            Write-Host "Running... $i / $seconds seconds"
            Start-Sleep -Seconds 10
          }
