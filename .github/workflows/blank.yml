name: Premium server

on:
  workflow_dispatch:

env:
  PREMIUM_USERNAME: ServerPremium
  PREMIUM_PASS: ServerPre@123

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create user
        shell: cmd
        run: |
          net user "%PREMIUM_USERNAME%" "%PREMIUM_PASS%" /add
          net localgroup administrators "%PREMIUM_USERNAME%" /add
          net localgroup "Remote Desktop Users" "%PREMIUM_USERNAME%" /add

      - name: Cloudflare Tunnel
        shell: cmd
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          call "%GITHUB_WORKSPACE%\cloudflared.bat"

      - name: Register admin install script
        shell: cmd
        run: |
          if not exist "C:\ProgramData\PremiumServer" (
              mkdir "C:\ProgramData\PremiumServer"
          )

          copy /Y "%GITHUB_WORKSPACE%\install.bat" ^
            "C:\ProgramData\PremiumServer\install.bat"

          schtasks /delete ^
            /tn "PremiumServer Login Installer" ^
            /f >nul 2>&1

          schtasks /create ^
            /tn "PremiumServer Login Installer" ^
            /tr "cmd.exe /c C:\ProgramData\PremiumServer\install.bat" ^
            /sc onlogon ^
            /ru "%PREMIUM_USERNAME%" ^
            /rp "%PREMIUM_PASS%" ^
            /rl highest ^
            /f

          echo.
          echo ==========================================
          echo Admin login task registered successfully.
          echo ==========================================

      - name: Show credentials
        shell: cmd
        run: |
          echo.
          echo ==========================================
          echo RDP Host : ${{ secrets.CF_HOSTNAME }}
          echo User     : %RDP_USER%
          echo Password : %RDP_PASS%
          echo ==========================================
          echo.

      - name: Keep alive
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\sleep.bat"